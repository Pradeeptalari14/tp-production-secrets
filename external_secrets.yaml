# Kubernetes External Secrets Operator (ESO) Mapping
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-database-credentials
  namespace: production
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: k8s-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: db-username
      remoteRef:
        key: "database/creds/readonly"
        property: username
    - secretKey: db-password
      remoteRef:
        key: "database/creds/readonly"
        property: password
